
# --- General ---
set -g base-index 1
set -g history-limit 10000
set -g default-terminal screen-256color
set -g status-keys vi
set -g mouse on
set -sg escape-time 0
set-option -g renumber-windows on
set-option -g set-titles on
set-window-option -g automatic-rename on
set-window-option -g monitor-activity on
set-window-option -g xterm-keys on

# --- Key Bindings ---

# Reload config
bind r source-file ~/.tmux.conf

# Split panes (preserves cwd)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# New window (preserves cwd)
bind c new-window -c "#{pane_current_path}"

# Resize panes
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

# Navigate panes (vim-style, with and without prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-H     previous-window
bind -n M-L     next-window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

# Move windows (follow the moved window to its new position)
bind-key -r "<" swap-window -t -1 \; select-window -t -1
bind-key -r ">" swap-window -t +1 \; select-window -t +1
bind-key -n M-K swap-window -t -1 \; select-window -t -1
bind-key -n M-J swap-window -t +1 \; select-window -t +1

# --- Theme ---
set -g status-bg black
set -g status-fg white
set -g window-status-current-style bg=cyan,fg=white,bold
set -g status-interval 10
set -g status-left-length 30
set -g status-right-length 250
set -g status-left '#[fg=green](#S) #(whoami) '
set -g status-right '#{prefix_highlight} #(~/go/bin/gitmux "#{pane_current_path}")#[default] | #(~/.config/tmux/tmux-cpu.sh) | #(~/.config/tmux/tmux-mem.sh) | #(~/.config/tmux/tmux-disk.sh) #(~/.config/tmux/tmux-battery.sh) | #[fg=white]#(TZ="America/Denver" date "+%%d-%%b-%%y %%H:%%M")'

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux-yank: copy mode (prefix+[) — y to copy to clipboard, Y to copy+paste to cmdline
#            normal mode — prefix+y copies cmdline, prefix+Y copies pane path
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-open: open files/urls in copy mode with o
set -g @plugin 'tmux-plugins/tmux-open'

# Status bar extras
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'  # #{prefix_highlight}

# tmux-resurrect: prefix+Ctrl-s to save, prefix+Ctrl-r to restore
# To restore a specific save: ln -sf <file> ~/.tmux/resurrect/last, then prefix+Ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum: auto-saves every 15 min, restores on boot
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-boot 'on'

# Install plugins: prefix+I    Update: prefix+U
run -b '~/.tmux/plugins/tpm/tpm'
